<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a1a0c" />
      <stop offset="50%" stop-color="#140d08" />
      <stop offset="100%" stop-color="#070504" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#f5bb67" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#c9802e" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d9" />
      <stop offset="50%" stop-color="#f5bb67" />
      <stop offset="100%" stop-color="#c9802e" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <circle cx="600" cy="350" r="300" fill="url(#goldGlow)" />
  
  <!-- Traditional Boushiya & Gold Motif Silhouette -->
  <g transform="translate(600, 380)" text-anchor="middle">
    <!-- Outer Decorative Arch -->
    <path d="M-180,180 C-180,-80 180,-80 180,180" fill="none" stroke="url(#goldStroke)" stroke-width="2.5" opacity="0.4" stroke-dasharray="6,6" />
    <path d="M-150,180 C-150,-50 150,-50 150,180" fill="none" stroke="url(#goldStroke)" stroke-width="3" opacity="0.8" />
    <circle cx="0" cy="-60" r="14" fill="url(#goldStroke)" />
    
    <!-- Boushiya & Gold Crown Symbol -->
    <path d="M-60,-10 C-30,-35 30,-35 60,-10 C45,60 -45,60 -60,-10 Z" fill="none" stroke="url(#goldStroke)" stroke-width="3" />
    <path d="M-80,40 C-30,120 30,120 80,40" fill="none" stroke="url(#goldStroke)" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="30" r="6" fill="#f5bb67" />
    <circle cx="-35" cy="18" r="4" fill="#f5bb67" />
    <circle cx="35" cy="18" r="4" fill="#f5bb67" />
  </g>
</svg>
